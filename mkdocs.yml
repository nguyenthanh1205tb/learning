site_name: Learning Hub - Golang & Python
site_description: Tài liệu tự học Golang và Python bằng tiếng Việt
site_url: https://nguyenthanh1205tb.github.io/learning/
repo_url: https://github.com/nguyenthanh1205tb/learning

# Thư mục docs/ được tạo lúc build bằng cách copy README.md, golang/, python/
# (xem .github/workflows/pages.yml) nên không cần di chuyển file bài học
docs_dir: docs

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Chế độ sáng

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

nav:
  - Trang chủ: README.md
  - Golang:
      - golang/README.md
      - Bài 1 - Giới thiệu & Cài đặt: golang/01-introduction-setup.md
      - Bài 2 - Biến & Kiểu dữ liệu: golang/02-variables-types.md
      - Bài 3 - Cấu trúc điều khiển: golang/03-control-flow.md
      - Bài 4 - Hàm: golang/04-functions.md
      - Bài 5 - Array, Slice & Map: golang/05-arrays-slices-maps.md
      - Bài 6 - Struct, Method & Interface: golang/06-structs-methods-interfaces.md
      - Bài 7 - Xử lý lỗi: golang/07-error-handling.md
      - Bài 8 - Concurrency: golang/08-concurrency.md
      - Bài 9 - Package, Module & Testing: golang/09-packages-modules-testing.md
      - Bài 10 - Dự án tổng hợp: golang/10-final-project.md
      - Bài 11 - File, JSON & CLI: golang/11-files-json-cli.md
      - Bài 12 - HTTP Client & Web API: golang/12-http-apis.md
      - Bài 13 - Database: golang/13-database-sql.md
      - Bài 14 - Concurrency nâng cao: golang/14-advanced-concurrency.md
      - Bài 15 - Generics, Reflection & Stdlib: golang/15-generics-reflection-stdlib.md
      - Bài 16 - Go trong Production: golang/16-production-ready.md
      - Bài 17 - Docker: golang/17-docker.md
      - Bài 18 - gRPC: golang/18-grpc.md
  - Python:
      - python/README.md
      - Bài 1 - Giới thiệu & Cài đặt: python/01-introduction-setup.md
      - Bài 2 - Biến & Kiểu dữ liệu: python/02-variables-types.md
      - Bài 3 - Cấu trúc điều khiển: python/03-control-flow.md
      - Bài 4 - Hàm: python/04-functions.md
      - Bài 5 - Cấu trúc dữ liệu: python/05-data-structures.md
      - Bài 6 - OOP: python/06-oop.md
      - Bài 7 - Exceptions & File: python/07-exceptions-files.md
      - Bài 8 - Modules & Packages: python/08-modules-packages.md
      - Bài 9 - Python nâng cao: python/09-advanced-python.md
      - Bài 10 - Dự án tổng hợp: python/10-final-project.md
      - Bài 11 - Thư viện chuẩn thực chiến: python/11-stdlib-practical.md
      - Bài 12 - HTTP & Web API: python/12-http-web-apis.md
      - Bài 13 - Database: python/13-databases.md
      - Bài 14 - Concurrency & Parallelism: python/14-concurrency-parallelism.md
      - Bài 15 - Xử lý dữ liệu & Tự động hóa: python/15-data-processing.md
      - Bài 16 - Python trong Production: python/16-production-ready.md
