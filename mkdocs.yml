site_name: Learning Hub - Backend Engineering
site_description: Tài liệu tự học Golang, Python, Backend, Thuật toán và tư duy Software Engineer bằng tiếng Việt
site_url: https://nguyenthanh1205tb.github.io/learning/
repo_url: https://github.com/nguyenthanh1205tb/learning

# Thư mục docs/ được tạo lúc build bằng cách copy README.md, golang/, python/, backend/, algorithms/, mindset/, static/
# (xem .github/workflows/pages.yml) nên không cần di chuyển file bài học
docs_dir: docs

theme:
  name: material
  language: vi
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Chế độ sáng

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

extra_css:
  - static/css/algo-viz.css

extra_javascript:
  - static/js/algo-viz.js

